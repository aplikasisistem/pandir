# Netlify Configuration for PandirStore PWA & Serverless Auth
# Documentation: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Force Node.js v22 for full compatibility with Vite 8, React 19, and Tailwind CSS v4
  NODE_VERSION = "22"
  # Avoid peer dependency installation failures on clean CI containers
  NPM_FLAGS = "--legacy-peer-deps"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ==============================================================================
# Netlify Serverless Functions API Proxy Rules (MUST precede SPA catch-all /*)
# ==============================================================================

# 1. Forward all /api/auth and sub-paths to the serverless auth function
[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

# 2. Forward direct /.netlify/functions/auth/* paths to the handler
[[redirects]]
  from = "/.netlify/functions/auth/*"
  to = "/.netlify/functions/auth"
  status = 200

# ==============================================================================
# Single Page Application (SPA) redirect rule
# Ensures client-side routing works for all URLs without 404 errors
# ==============================================================================
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ==============================================================================
# Cache-Control headers to ensure immediate updates are visible to visitors
# ==============================================================================

# 1. Entry HTML must never be cached so users always receive the newest asset bundles
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# 2. Service Worker script must always be fetched fresh
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# 3. Web App Manifest
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# 4. Static hashed assets (JS/CSS chunks generated by Vite) can be safely cached long-term
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
